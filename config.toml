# AI × 币圈 每日素材包：数据采集配置
# 改完保存即可，下次运行生效。

# 抓过去多少小时的新闻和推文
lookback_hours = 24

# 数据输出目录
output_dir = "~/Documents/X早报"

# 关注币种：CoinGecko 的 id + OKX 永续合约
[[coins]]
symbol = "BTC"
coingecko_id = "bitcoin"
okx_swap = "BTC-USDT-SWAP"

[[coins]]
symbol = "ETH"
coingecko_id = "ethereum"
okx_swap = "ETH-USDT-SWAP"

[[coins]]
symbol = "ZEC"
coingecko_id = "zcash"
okx_swap = "ZEC-USDT-SWAP"

